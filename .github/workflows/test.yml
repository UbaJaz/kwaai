# Runs the test suite on every pull request and every push to main.
# Free: the repository is public, and GitHub doesn't charge for standard runners in public repositories.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the same major version as the Dockerfile; node:sqlite needs 22.13 or later
          cache: npm
      - run: npm ci
      - run: npm test
